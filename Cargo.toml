[workspace]
resolver = "3"
members = [
    "crates/hdl-cat-error",
    "crates/hdl-cat-bits",
    "crates/hdl-cat-kind",
    "crates/hdl-cat-signal",
    "crates/hdl-cat-ir",
    "crates/hdl-cat-circuit",
    "crates/hdl-cat-sync",
    "crates/hdl-cat-sim",
    "crates/hdl-cat-verilog",
    "crates/hdl-cat-circom",
    "crates/hdl-cat-std",
    "crates/hdl-cat-macros",
    "crates/hdl-cat",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MavenRain/hdl-cat"
readme = "README.md"
keywords = ["hardware", "hdl", "category-theory", "verilog", "simulation"]
categories = ["hardware-support", "simulation", "science"]

[workspace.dependencies]
comp-cat-rs = "0.5"
hdl-cat-error = { path = "crates/hdl-cat-error", version = "0.3" }
hdl-cat-bits = { path = "crates/hdl-cat-bits", version = "0.3" }
hdl-cat-kind = { path = "crates/hdl-cat-kind", version = "0.3" }
hdl-cat-signal = { path = "crates/hdl-cat-signal", version = "0.3" }
hdl-cat-ir = { path = "crates/hdl-cat-ir", version = "0.3" }
hdl-cat-circuit = { path = "crates/hdl-cat-circuit", version = "0.3" }
hdl-cat-sync = { path = "crates/hdl-cat-sync", version = "0.3" }
hdl-cat-sim = { path = "crates/hdl-cat-sim", version = "0.3" }
hdl-cat-verilog = { path = "crates/hdl-cat-verilog", version = "0.7" }
hdl-cat-circom = { path = "crates/hdl-cat-circom", version = "0.4" }
hdl-cat-std = { path = "crates/hdl-cat-std", version = "0.3" }
hdl-cat-macros = { path = "crates/hdl-cat-macros", version = "0.3" }
proptest = "1"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
